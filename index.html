<html>
    <head>
        <title>HI!</title>
    </head>
    <body>
        <canvas id="canv">
            
        </canvas>
          <script>
            let canvas = document.querySelector("#canv")
            let ctx = canvas.getContext("2d")

            canvas.width = window.innerWidth
            canvas.height = window.innerHeight

            ctx.save()

            ctx.translate(300, 300)

            ctx.lineTo(0, -200)
            ctx.lineTo(100, -300)
            ctx.lineTo(100, 0)
            ctx.lineTo(500, -400)
            ctx.lineTo(600, -500)
            ctx.lineTo(550, 0)
            ctx.lineTo(0, 400)

            ctx.lineTo(0, -200)
            ctx.lineTo(-100, -300)
            ctx.lineTo(-100, 0)
            ctx.lineTo(-500, -400)
            ctx.lineTo(-600, -500)
            ctx.lineTo(-550, 0)
            ctx.lineTo(0, 400)


            ctx.fillStyle = "orange"
            ctx.fill()
            ctx.restore()
        </script>
    </body>
</html>
