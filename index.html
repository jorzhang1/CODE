<html>
    <head>
        <title>Game Loop</title>
        <style>
            *{
                margin: 0;
                overflow: hidden;
            }
        </style>
    </head>
    <body>

        <canvas id="canv"></canvas>

        <script src="Vector2.js"></script>

        <script>
            let canvas = document.querySelector("#canv")
            let ctx = canvas.getContext("2d")

            let position = new Vector2(150, 150)

            function update(){
                position.x += 5
                position.y += 5
            }

            function gameLoop(){
                update()
                draw()
                requestAnimationFrame(gameLoop)
            }

            function draw(){
                canvas.width = window.innerWidth
                canvas.height = window.innerHeight

                ctx.save()

                ctx.translate(position.x, position.y)

                ctx.lineTo(0, -20)
                ctx.lineTo(10, -30)
                ctx.lineTo(10, 0)
                ctx.lineTo(50, -40)
                ctx.lineTo(0, -20)
                ctx.lineTo(-10, -30)
                ctx.lineTo(-10, 0)
                ctx.lineTo(-50, -40)

                ctx.fillStyle = "orange"
                ctx.fill()
                ctx.restore()
            }

            requestAnimationFrame(gameLoop)
        </script>

    </body>
</html>
