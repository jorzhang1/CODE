<html>

<head>
    <title>Game Loop</title>
    <style>
        * {
            margin: 0;
            overflow: hidden;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wdth,wght@75..125,300..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <canvas id="canv"></canvas>

    <script src="../../engine/Vector2.js"></script>
    <script src="../../engine/Scene.js"></script>
    <script src="../../engine/Engine.js"></script>
    <script src="../../engine/Input.js"></script>
    <script src="../../engine/GameObject.js"></script>
    <script src="../../engine/Component.js"></script>
    <script src="../../engine/Time.js"></script>
    <script src="../../engine/Collisions.js"></script>
    <script src="../../engine/SceneManager.js"></script>
    <script src="../../engine/components/Transform.js"></script>
    <script src="../../engine/components/Polygon.js"></script>
    <script src="../../engine/components/TextLabel.js"></script>
    <script src="../../engine/components/Collider.js"></script>
    <script src="../../engine/components/Camera.js"></script>
    <script src="../../engine/components/MultiLineTextLabel.js"></script>

    <script src="../Spaceshooter/scenes/GenericLevel.js"></script>
    <script src="../Spaceshooter/scenes/Level01.js"></script>
    <script src="../Spaceshooter/scenes/Level02.js"></script>

    <script src="../Spaceshooter/gameObjects/PlayerGameObject.js"></script>
    <script src="../Spaceshooter/components/UpdateComponent.js"></script>
    <script src="../Spaceshooter/components/EnemyController.js"></script>
    <script src="../Spaceshooter/components/LaserController.js"></script>
    <script src="../Spaceshooter/components/LevelController.js"></script>
    <script src="../Spaceshooter/components/SceneTimerController.js"></script>
    <script src="../Spaceshooter/components/PointsController.js"></script>
    <script src="../Spaceshooter/components/Health.js"></script>

    <script src="../Spaceshooter/Assets.js"></script>
    <script src="../Spaceshooter/Globals.js"></script>
    <script src="../Spaceshooter/Settings.js"></script>

    <script src="../Spaceshooter/gameObjects/LaserGameObject.js"></script>
    <script src="../Spaceshooter/gameObjects/EnemyGameObjects.js"></script>
    <script src="../Spaceshooter/gameObjects/HelperGameObject.js"></script>
    <script src="../Spaceshooter/gameObjects/PointsGameObject.js"></script>
    <script src="../Spaceshooter/gameObjects/LevelControllerGameObject.js"></script>
    <script>
        Engine.start(Level01, Settings)

        // tests
        let gameObject = new GameObject()
        gameObject.addComponent(new Polygon(), {
            points: [
                new Vector2(0, -1),
                new Vector2(-1, 1),
                new Vector2(1, 1)
            ]
        })

        let two = new GameObject()
        two.addComponent(new Polygon(), {
            points: [
                new Vector2(0, 1),
                new Vector2(1, -1),
                new Vector2(-1, -1)
            ]
        })

        console.assert(Collisions.isCollisionPointPolygon(new Vector2(0, 0), gameObject))
        console.assert(!Collisions.isCollisionPointPolygon(new Vector2(10000, 10000), gameObject))
        console.assert(!Collisions.isCollisionPointPolygon(new Vector2(0, 1.1), gameObject))
        console.assert(!Collisions.isCollisionPointPolygon(new Vector2(0, -1.1), gameObject))

        console.assert(Collisions.isCollisionPolygonPolygon(gameObject, two))

        two.transform.position = new Vector2(1000, 1000)
        console.assert(!Collisions.isCollisionPolygonPolygon(gameObject, two))
    </script>
</body>

</html>
